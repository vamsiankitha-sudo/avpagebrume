<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | AV Pagebrume</title>
  <meta name="description" content="That page is not on the AV Pagebrume site.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F4EE">
  <link rel="icon" href="https://vamsiankitha-sudo.github.io/avpagebrume/favicon.ico" sizes="any">
  <style>
    /* Self-contained so a missing URL at any depth still looks like the site.
       Relative paths would resolve against the broken address. */
    body {
      margin: 0;
      background: #f7f4ee;
      color: #2b2b2b;
      font-family: Inter, "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.65;
      border-top: 4px solid #8db596;
    }
    .box { width: min(100% - 2.5rem, 40rem); margin: 4.5rem auto 3rem; }
    h1 {
      font-weight: 500;
      letter-spacing: -0.03em;
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      line-height: 1.2;
      margin: 0 0 0.85rem;
    }
    p { margin: 0; }
    .mark {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      background: #8db596;
      color: #2b2b2b;
      text-decoration: none;
    }
    .button.secondary { background: transparent; box-shadow: inset 0 0 0 1px #2b2b2b; }
  </style>
</head>
<body>
  <main class="box" id="main">
    <p class="mark">AV Pagebrume</p>
    <h1>Page not found</h1>
    <p>That page is not on this site. It may have moved, or the address may have a typo.</p>
    <div class="actions">
      <a class="button" href="https://vamsiankitha-sudo.github.io/avpagebrume/">Back to the home page</a>
      <a class="button secondary" href="https://vamsiankitha-sudo.github.io/avpagebrume/free-printables/">Free coloring pages</a>
    </div>
  </main>
</body>
</html>
